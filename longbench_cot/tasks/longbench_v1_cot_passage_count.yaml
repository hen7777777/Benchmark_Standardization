task: longbench_v1_cot_passage_count
tag:
  - longbench_v1_cot_tasks
dataset_path: Xnhyacinth/LongBench
test_split: test
dataset_name: passage_count
doc_to_text: "There are some paragraphs below sourced from Wikipedia. Some of them may be duplicates. Please carefully read these paragraphs and determine how many unique paragraphs there are after removing duplicates. In other words, how many non-repeating paragraphs are there in total?\n\n{{context}}\n\nPlease enter the final count of unique paragraphs after removing duplicates. The output format should only contain the number, such as 1, 2, 3, and so on.\n\nThe final answer is:\n\nLet's think step by step, then write your final answer on a new line starting with \"Final answer:\"."
doc_to_target: '{{answers}}'
process_results: !function runtime_utils.v1_count
generation_kwargs:
  max_gen_toks: 1024
  do_sample: false
  temperature: 0.0
  until: []
metric_list:
  - metric: score
    aggregation: mean
    higher_is_better: true
  - metric: count_score
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1

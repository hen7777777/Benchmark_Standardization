task: longbench_v1_cot_multifieldqa_zh
tag:
  - longbench_v1_cot_tasks
dataset_path: Xnhyacinth/LongBench
test_split: test
dataset_name: multifieldqa_zh
doc_to_text: "阅读以下文字并用中文简短回答：\n\n{{context}}\n\n现在请基于上面的文章回答下面的问题，只告诉我答案，不要输出任何其他字词。\n\n问题：{{question}}\n回答：\n\nLet's think step by step, then write your final answer on a new line starting with \"Final answer:\"."
doc_to_target: '{{answers}}'
process_results: !function runtime_utils.v1_qa_f1_zh
generation_kwargs:
  max_gen_toks: 1024
  do_sample: false
  temperature: 0.0
  until: []
metric_list:
  - metric: score
    aggregation: mean
    higher_is_better: true
  - metric: qa_f1_zh_score
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1

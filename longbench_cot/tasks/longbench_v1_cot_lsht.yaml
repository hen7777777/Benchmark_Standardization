task: longbench_v1_cot_lsht
tag:
  - longbench_v1_cot_tasks
dataset_path: Xnhyacinth/LongBench
test_split: test
dataset_name: lsht
doc_to_text: "请判断给定新闻的类别，下面是一些例子。\n\n{{context}}\n{{question}}\n\nLet's think step by step, then write your final answer on a new line starting with \"Final answer:\"."
doc_to_target: '{{answers}}'
process_results: !function runtime_utils.v1_classification
generation_kwargs:
  max_gen_toks: 1024
  do_sample: false
  temperature: 0.0
  until: []
metric_list:
  - metric: score
    aggregation: mean
    higher_is_better: true
  - metric: classification_score
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1

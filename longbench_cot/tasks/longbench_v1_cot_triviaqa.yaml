task: longbench_v1_cot_triviaqa
tag:
  - longbench_v1_cot_tasks
dataset_path: Xnhyacinth/LongBench
test_split: test
dataset_name: triviaqa
doc_to_text: "Answer the question based on the given passage. Only give me the answer and do not output any other words. The following are some examples.\n\n{{context}}\n{{question}}\n\nLet's think step by step, then write your final answer on a new line starting with \"Final answer:\"."
doc_to_target: '{{answers}}'
process_results: !function runtime_utils.v1_qa_f1
generation_kwargs:
  max_gen_toks: 1024
  do_sample: false
  temperature: 0.0
  until: []
metric_list:
  - metric: score
    aggregation: mean
    higher_is_better: true
  - metric: qa_f1_score
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1
